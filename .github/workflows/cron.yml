name: Randomize Schedule
on:
  workflow_run:
    workflows: ["Update Steps"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-repository-updates
  cancel-in-progress: false

jobs:
  randomize-schedule:
    name: Randomize Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.PAT }}
      - name: Update and Save Schedule
        run: |
          source cron_convert.sh
          echo "Configured CRON_HOURS: ${{ vars.CRON_HOURS }}"
          persist_execute_log ${{ github.event_name }} ${{ vars.CRON_HOURS }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .github/workflows/run.yml cron_change_time
          current=`TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S'`
          if ! git diff --cached --quiet; then
            git commit -m "[${current}] Randomize schedule triggered by ${{ github.event_name }}"
            git push origin master
          fi
