name: Update Steps

on:
  schedule:
    - cron: '38 10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-repository-updates
  cancel-in-progress: false

jobs:
  build:
    name: Update Steps and Save Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Update Steps
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: Save Encrypted Tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if ! git diff --cached --quiet; then
            git commit -m "Save encrypted tokens triggered by ${{ github.event_name }}"
            git push origin master
          fi
